name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^e: |error:|What went wrong|Could not|FAILED" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: MyWallet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MyWallet.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MyWallet.apk --title "My Wallet (latest build)" --notes "Debug APK built by GitHub Actions"
